<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HS 1st Year – Quick Test</title>
  <link rel="stylesheet" href="hs1test.css">
</head>
<body>
  <div class="quiz-container">
    <h2>HS 1st Year – Quick Test</h2>

    <div class="question" data-mark="2">
      <p>1. HTML stands for: <span class="mark">(2 marks)</span></p>
      <label><input type="radio" name="q1" value="0"> High Text Machine Language</label>
      <label><input type="radio" name="q1" value="1"> Hyper Text Markup Language</label>
      <label><input type="radio" name="q1" value="0"> Hyper Tool Multi Language</label>
    </div>

    <div class="question" data-mark="3">
      <p>2. CSS is used for: <span class="mark">(3 marks)</span></p>
      <label><input type="radio" name="q2" value="1"> Designing web pages</label>
      <label><input type="radio" name="q2" value="0"> Programming logic</label>
      <label><input type="radio" name="q2" value="0"> Database management</label>
    </div>

    <div class="question" data-mark="5">
      <p>3. JS stands for: <span class="mark">(5 marks)</span></p>
      <label><input type="radio" name="q3" value="0"> Java System</label>
      <label><input type="radio" name="q3" value="1"> JavaScript</label>
      <label><input type="radio" name="q3" value="0"> Just Script</label>
    </div>

    <button id="submitBtn">Submit</button>
    <div id="result"></div>
  </div>

  <script src="hs1test.js"></script>
</body>
</html>
